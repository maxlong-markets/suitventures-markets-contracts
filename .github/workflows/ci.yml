name: CI

on:
  push:
  pull_request:

jobs:
  forge:
    name: Build and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # solmate is remapped to v4-core's nested copy, so nested submodules are needed.
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build with sizes (fails on an EIP-170 overflow in src)
        run: forge build --sizes --skip test --skip script

      # No `forge fmt --check` here: the repository is formatted with the forge 1.4 nightly it was built with, and
      # the stable formatter wraps one constant in src/SVLaunchpad.sol differently. src/ is deployed source and is
      # kept byte-identical (a whitespace change alters the metadata hash), so the check runs locally on that nightly.

      - name: Offline tests (fork tests need an RPC and are excluded)
        run: forge test --no-match-path 'test/fork/*'
